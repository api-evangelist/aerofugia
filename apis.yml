aid: aerofugia
name: Aerofugia
description: 'Aerofugia (沃飞长空, Sichuan Aerofugia Technology Development Co., Ltd.) is a Chengdu-based advanced air
  mobility company founded in 2020 under Zhejiang Geely Holding Group''s Geely Technology Group, focused on the
  research, certification and commercial operation of low-altitude passenger aircraft. Its flagship product is the
  AE200 series, a six-seat all-electric piloted eVTOL with a roughly 200 km range aimed at intercity air mobility,
  low-altitude tourism and emergency medical transport; the AE200 was the first piloted eVTOL type certificate application
  accepted by the Civil Aviation Administration of China, has completed full tilt-transition flight testing, and
  the company holds a CCAR-135 air operator certificate. As of this profile Aerofugia publishes no public developer
  program, API documentation or machine-readable API contract: it is an aircraft manufacturer and future air-mobility
  operator, not a platform vendor.'
